[package]
name = "soccer_vision_3d_msgs"
version = "1.0.0"
edition = "2021"

[dependencies]
rosidl_runtime_rs = "0.6"
serde = { version = "1", optional = true, features = ["derive"] }
serde-big-array = { version = "0.5.1", optional = true }

# ROS Dependencies
geometry_msgs = "*"
soccer_vision_attribute_msgs = "*"
std_msgs = "*"
vision_msgs = "*"

[features]
serde = ['dep:serde', 'dep:serde-big-array', 'rosidl_runtime_rs/serde', 'geometry_msgs/serde', 'soccer_vision_attribute_msgs/serde', 'std_msgs/serde', 'vision_msgs/serde']

[package.metadata.ros-env]
include = true
