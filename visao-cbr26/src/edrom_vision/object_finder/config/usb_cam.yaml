/**:
  ros__parameters:
    camera_name: "milare"          # verri ou milare: define o arquivo de calibração salvo
    video_device: "/dev/video2"
    image_width: 640              # mesma resolução do vision.launch
    image_height: 480
    framerate: 30.0
    pixel_format: "yuyv2rgb"
    frame_id: "camera_optical_frame"
    # -1 = não mexe no brilho da câmera. Sem isto o usb_cam aplica 50, que nesta câmera (escala -64 a 64,
    # padrão 0) é quase o máximo: o preto vira cinza e as cores desbotam.
    brightness: -1
